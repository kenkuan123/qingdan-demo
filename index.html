<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>自律就是高貴清單・快照</title>
    <style>
      :root {
        --bg: #070d16;
        --bg-2: #0a1220;
        --card: #0c1524;
        --card-2: #0e1828;
        --ink: #f4f7fb;
        --sub: #a7b3c4;
        --faint: #6d7b8f;
        --gold: #f2c14e;
        --gold-dim: #c9a24a;
        --blue: #3fa7e0;
        --cyan: #57c8d8;
        --green: #3ecf7f;
        --red: #f06a7e;
        --line: rgba(120, 150, 190, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC",
          "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 14px 28px;
      }

      /* ---------- blue-gold edge card ---------- */
      .edge {
        border: 1.5px solid transparent;
        border-radius: 16px;
        background:
          linear-gradient(var(--card), var(--card)) padding-box,
          linear-gradient(135deg, var(--blue) 0%, rgba(63,167,224,0.55) 34%,
            rgba(242,193,78,0.55) 66%, var(--gold) 100%) border-box;
      }
      .edge-soft {
        border: 1px solid transparent;
        border-radius: 12px;
        background:
          linear-gradient(var(--card-2), var(--card-2)) padding-box,
          linear-gradient(135deg, rgba(63,167,224,0.5), rgba(242,193,78,0.45)) border-box;
      }

      /* ---------- header ---------- */
      header { margin-bottom: 14px; }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #fff;
      }
      .snap-tag {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        color: var(--gold);
        border: 1px solid rgba(242,193,78,0.5);
        border-radius: 999px;
        padding: 4px 10px;
        background: rgba(242,193,78,0.06);
      }
      .snap-note {
        margin: 7px 0 0;
        font-size: 12.5px;
        color: var(--sub);
      }

      /* ---------- tab bar ---------- */
      .tabs {
        display: flex;
        gap: 4px;
        padding: 5px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      .tab {
        flex: 1;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--sub);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 9px 4px;
        min-height: 40px;
        border-radius: 999px;
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        color: var(--gold);
        background: rgba(242,193,78,0.10);
        box-shadow: inset 0 0 0 1px rgba(242,193,78,0.45);
      }
      .tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

      section[hidden] { display: none; }

      /* ---------- progress cards ---------- */
      .progress {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 16px;
      }
      .pcard { padding: 12px 8px 11px; text-align: center; }
      .pcard .label {
        font-size: 13px;
        font-weight: 700;
        color: var(--sub);
        margin-bottom: 4px;
      }
      .pcard .num {
        font-size: 30px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .pcard .done {
        color: var(--gold);
        text-shadow: 0 0 10px rgba(242,193,78,0.45);
      }
      .pcard .total { color: #fff; font-size: 19px; font-weight: 700; }

      /* ---------- groups & rows ---------- */
      .group-title {
        margin: 0 2px 8px;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        letter-spacing: 0.04em;
      }
      .group { margin-bottom: 16px; }
      .rows { display: flex; flex-direction: column; gap: 6px; }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        min-height: 42px;
      }
      .row .name {
        flex: 1;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }
      .star { flex: none; width: 18px; height: 18px; display: block; }
      .star.gold { color: var(--gold-dim); }
      .star.cyan { color: var(--cyan); opacity: 0.75; }
      .star.neutral { color: #54657c; }
      .star-btn {
        flex: none;
        appearance: none;
        border: 0;
        background: transparent;
        padding: 7px;
        margin: -7px -2px;
        border-radius: 8px;
        cursor: pointer;
      }
      .star-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .chip {
        appearance: none;
        font: inherit;
        cursor: pointer;
        flex: none;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 5px 12px;
        line-height: 1.5;
        min-height: 30px;
        min-width: 62px;
      }
      .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .chip.todo {
        color: var(--sub);
        border: 1px solid var(--line);
        background: rgba(167,179,196,0.06);
      }
      .chip.wait {
        color: #f5a65b;
        border: 1px solid rgba(245,166,91,0.5);
        background: rgba(245,166,91,0.08);
      }
      .chip.done {
        color: var(--green);
        border: 1px solid rgba(62,207,127,0.45);
        background: rgba(62,207,127,0.08);
      }
      .row.is-done .name {
        opacity: 0.45;
        text-decoration: line-through;
      }
      .row.picked {
        box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(242,193,78,0.35);
      }

      /* ---------- demo toolbar ---------- */
      .demo-bar { padding: 12px; margin-bottom: 16px; }
      .demo-row { display: flex; gap: 8px; align-items: center; }
      .demo-row + .demo-row { margin-top: 8px; }
      .demo-input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: rgba(167,179,196,0.06);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
        min-height: 42px;
      }
      .demo-input::placeholder { color: var(--faint); }
      .demo-input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
      .btn {
        appearance: none;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        border-radius: 10px;
        padding: 9px 16px;
        min-height: 42px;
        cursor: pointer;
        flex: none;
      }
      .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .btn-add {
        color: #0a1220;
        background: var(--gold);
        border: 1px solid var(--gold);
      }
      .btn-draw {
        color: var(--gold);
        background: rgba(242,193,78,0.08);
        border: 1px solid rgba(242,193,78,0.45);
      }
      .draw-result { font-size: 13.5px; color: var(--sub); }
      .draw-result b { color: var(--gold); }

      /* ---------- meeting / offer cards ---------- */
      .big-card { padding: 16px; margin-bottom: 10px; }
      .big-card h2 {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: 800;
        color: #fff;
      }
      .big-card .meta {
        margin: 0 0 10px;
        font-size: 13.5px;
        color: var(--sub);
        line-height: 1.6;
      }
      .big-card .counts {
        display: flex;
        gap: 18px;
        font-size: 14px;
        color: var(--sub);
      }
      .big-card .counts b {
        color: var(--gold);
        font-size: 18px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .big-card .body-line {
        margin: 0;
        font-size: 13.5px;
        color: var(--sub);
        line-height: 1.6;
      }

      footer {
        margin-top: 18px;
        text-align: center;
        font-size: 11.5px;
        color: var(--faint);
      }

      @media (max-width: 360px) {
        .pcard .num { font-size: 26px; }
        h1 { font-size: 19px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title-row">
          <h1>自律就是高貴清單・快照</h1>
          <span class="snap-tag">快照：2026-11-26</span>
        </div>
        <p class="snap-note">示範版：可即場㩒俾人睇，唔會儲存。</p>
      </header>

      <nav class="tabs edge" role="tablist" aria-label="清單分頁">
        <button class="tab" role="tab" id="tab-today" aria-selected="true" aria-controls="panel-today" data-tab="today">今日名單</button>
        <button class="tab" role="tab" id="tab-meet" aria-selected="false" aria-controls="panel-meet" data-tab="meet">推會議</button>
        <button class="tab" role="tab" id="tab-offer" aria-selected="false" aria-controls="panel-offer" data-tab="offer">推優惠</button>
      </nav>

      <!-- ============ Tab 1：今日名單 ============ -->
      <section id="panel-today" role="tabpanel" aria-labelledby="tab-today">
        <div class="progress">
          <div class="pcard edge-soft">
            <div class="label">聯絡</div>
            <div class="num"><span class="done" id="cnt-contact">2</span> <span class="total">/ <span id="tot-contact">10</span></span></div>
          </div>
          <div class="pcard edge-soft">
            <div class="label">約會</div>
            <div class="num"><span class="done">0</span> <span class="total">/ 3</span></div>
          </div>
          <div class="pcard edge-soft">
            <div class="label">陌生認識</div>
            <div class="num"><span class="done" id="cnt-new">0</span> <span class="total">/ 5</span></div>
          </div>
        </div>

        <div class="demo-bar edge-soft">
          <div class="demo-row">
            <input class="demo-input" id="add-input" type="text" placeholder="輸入名字" aria-label="輸入名字" autocomplete="off" />
            <button class="btn btn-add" id="add-btn" type="button">新增</button>
          </div>
          <div class="demo-row">
            <button class="btn btn-draw" id="draw-btn" type="button">隨機抽</button>
            <span class="draw-result" id="draw-result" aria-live="polite"></span>
          </div>
        </div>

        <div class="group">
          <h2 class="group-title">跟進</h2>
          <div class="rows" id="follow-rows"></div>
        </div>

        <div class="group">
          <h2 class="group-title">新聯絡</h2>
          <div class="rows" id="new-rows"></div>
        </div>
      </section>

      <!-- ============ Tab 2：推會議 ============ -->
      <section id="panel-meet" role="tabpanel" aria-labelledby="tab-meet" hidden>
        <article class="big-card edge">
          <h2>會議示例（一）</h2>
          <p class="meta">日期：示例 · 時間：示例 · 地點：示例</p>
          <div class="counts">
            <span>邀請 <b>0</b> 位</span>
            <span>出席 <b>0</b> 位</span>
          </div>
        </article>
        <article class="big-card edge">
          <h2>會議示例（二）</h2>
          <p class="meta">日期：示例 · 時間：示例 · 地點：示例</p>
          <div class="counts">
            <span>邀請 <b>0</b> 位</span>
            <span>出席 <b>0</b> 位</span>
          </div>
        </article>
      </section>

      <!-- ============ Tab 3：推優惠 ============ -->
      <section id="panel-offer" role="tabpanel" aria-labelledby="tab-offer" hidden>
        <article class="big-card edge">
          <h2>優惠示例（一）</h2>
          <p class="body-line">內容：示例</p>
        </article>
        <article class="big-card edge">
          <h2>優惠示例（二）</h2>
          <p class="body-line">內容：示例</p>
        </article>
      </section>

      <footer>快照日期：2026-11-26</footer>
    </div>

    <script>
      // ---- Tab switching (view only; nothing is stored or changed) ----
      var tabs = document.querySelectorAll('.tab');
      var panels = {
        today: document.getElementById('panel-today'),
        meet: document.getElementById('panel-meet'),
        offer: document.getElementById('panel-offer')
      };
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
          tab.setAttribute('aria-selected', 'true');
          Object.keys(panels).forEach(function (key) {
            panels[key].hidden = key !== tab.dataset.tab;
          });
        });
      });

      // ---- Interactive demo rows (in-page only; nothing is stored, reload resets) ----
      var STATES = [
        { key: 'todo', label: '未揾' },
        { key: 'wait', label: '未覆' },
        { key: 'done', label: '已完成' }
      ];
      var STAR_CLASSES = ['neutral', 'cyan', 'gold'];
      var STAR_PATH = 'M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.45l-5.81 3.05L7.3 14.03 2.6 9.45l6.5-.95z';

      var followBox = document.getElementById('follow-rows');
      var newBox = document.getElementById('new-rows');

      function makeRow(label, starClass, stateIdx) {
        var row = document.createElement('div');
        row.className = 'row edge-soft';
        row.innerHTML =
          '<span class="name"></span>' +
          '<button type="button" class="star-btn" aria-label="切換星顏色">' +
            '<svg class="star ' + starClass + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + STAR_PATH + '"/></svg>' +
          '</button>' +
          '<button type="button" class="chip"></button>';
        row.querySelector('.name').textContent = label;
        row._state = stateIdx;
        row._star = STAR_CLASSES.indexOf(starClass);

        var chip = row.querySelector('.chip');
        var starBtn = row.querySelector('.star-btn');
        var starSvg = row.querySelector('.star');

        function paint() {
          chip.className = 'chip ' + STATES[row._state].key;
          chip.textContent = STATES[row._state].label;
          row.classList.toggle('is-done', row._state === 2);
          starSvg.setAttribute('class', 'star ' + STAR_CLASSES[row._star]);
        }
        // 狀態 chip：㩒一下循環 未揾 → 未覆 → 已完成 → 未揾
        chip.addEventListener('click', function () {
          row._state = (row._state + 1) % STATES.length;
          paint();
          updateCounts();
        });
        // 星：㩒一下循環 中性 → 青 → 金 → 中性
        starBtn.addEventListener('click', function () {
          row._star = (row._star + 1) % STAR_CLASSES.length;
          paint();
        });
        paint();
        return row;
      }

      function countDone(box) {
        var n = 0;
        for (var i = 0; i < box.children.length; i++) {
          if (box.children[i]._state === 2) n++;
        }
        return n;
      }
      function updateCounts() {
        document.getElementById('cnt-contact').textContent = countDone(followBox);
        document.getElementById('tot-contact').textContent = followBox.children.length;
        document.getElementById('cnt-new').textContent = countDone(newBox);
      }

      // 跟進：10 rows — star colours vary as an example; two rows start 已完成
      var followStars = ['gold', 'cyan', 'neutral', 'gold', 'neutral', 'cyan', 'neutral', 'gold', 'neutral', 'cyan'];
      var followStates = [0, 0, 2, 0, 0, 0, 0, 2, 0, 0];
      for (var i = 0; i < 10; i++) {
        followBox.appendChild(makeRow('聯絡 ' + (i + 1), followStars[i], followStates[i]));
      }

      // 新聯絡：5 rows — neutral stars, all 未揾
      for (var j = 0; j < 5; j++) {
        newBox.appendChild(makeRow('新聯絡 ' + (j + 1), 'neutral', 0));
      }
      updateCounts();

      // ---- 自己加名：新增落跟進組，同其他行一樣可㩒 ----
      var addInput = document.getElementById('add-input');
      function addName() {
        var v = addInput.value.trim();
        if (!v) return;
        followBox.appendChild(makeRow(v, 'neutral', 0));
        addInput.value = '';
        addInput.focus();
        updateCounts();
      }
      document.getElementById('add-btn').addEventListener('click', addName);
      addInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addName();
      });

      // ---- 隨機抽名：隨機抽一位高亮，再㩒再抽 ----
      var drawResult = document.getElementById('draw-result');
      document.getElementById('draw-btn').addEventListener('click', function () {
        var all = [];
        [followBox, newBox].forEach(function (box) {
          for (var i = 0; i < box.children.length; i++) all.push(box.children[i]);
        });
        if (!all.length) return;
        all.forEach(function (r) { r.classList.remove('picked'); });
        var pick = all[Math.floor(Math.random() * all.length)];
        pick.classList.add('picked');
        pick.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        drawResult.innerHTML = '抽中：<b></b>';
        drawResult.querySelector('b').textContent = pick.querySelector('.name').textContent;
      });
    </script>
  </body>
</html>
