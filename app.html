<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>十三一清單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: dark;
        --bg:#060a13;
        --panel:#0b1322;
        --panel2:#0e1830;
        --ink:#eef2f8;
        --mut:#93a7c0;
        --mut2:#647690;
        --gold:#c9a24d;
        --gold2:#eccd6f;
        --goldbright:#f2c93c;
        --blue:#5ea8dd;
        --cyan:#3ec6dd;
        --teal:#6dabb9;
        --green:#4cc38a;
        --amber:#d99a3d;
        --pink:#e58aa5;
        --radius:16px;
      }
      *{ box-sizing:border-box; }
      html{ -webkit-text-size-adjust:100%; }
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size:16px;
        line-height:1.5;
        min-height:100vh;
      }
      body::before{
        content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
        background-image:
          linear-gradient(rgba(110,160,220,.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(110,160,220,.05) 1px, transparent 1px);
        background-size:44px 44px;
      }
      button, input, select, textarea{ font:inherit; color:inherit; }
      button{ cursor:pointer; }
      button, select, input:not([type="range"]){ min-height:2.375rem; }

      .wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:10px 12px 70px; }

      .site-name{
        font-family:"Noto Serif TC", serif; font-weight:900; font-size:15px;
        letter-spacing:.35em; color:var(--gold2); margin:2px 2px 8px; opacity:.92;
      }

      /* ---------- capsule tabs ---------- */
      .tabs{
        position:sticky; top:6px; z-index:30;
        display:flex; gap:4px; padding:5px;
        border-radius:999px;
        background:rgba(9,14,26,.92);
        backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border:1px solid rgba(120,150,190,.25);
        margin-bottom:14px;
      }
      .tab-btn{
        flex:1; border:1px solid transparent; border-radius:999px;
        background:transparent; color:var(--mut);
        font-weight:900; font-size:15.5px; padding:7px 4px; min-height:42px;
      }
      .tab-btn[aria-selected="true"]{
        color:var(--gold2);
        background:linear-gradient(135deg, rgba(94,168,221,.32), rgba(201,162,77,.32));
        border-color:rgba(201,162,77,.5);
        text-shadow:0 0 8px rgba(201,162,77,.35);
      }

      /* gradient-border card */
      .gcard{
        border:1px solid transparent;
        border-radius:var(--radius);
        background:
          linear-gradient(var(--panel), var(--panel)) padding-box,
          linear-gradient(135deg, rgba(94,168,221,.60), rgba(94,168,221,.10) 42%, rgba(201,162,77,.10) 58%, rgba(201,162,77,.60)) border-box;
        box-shadow: inset 0 0 22px rgba(94,168,221,.05), inset 0 0 30px rgba(201,162,77,.03);
      }

      /* ---------- daily header ---------- */
      .date-row{ display:flex; align-items:flex-start; gap:10px; }
      .date-pill{
        border:1px solid rgba(201,162,77,.55); border-radius:999px; min-height:38px;
        padding:7px 15px; font-weight:900; font-size:13.5px; color:#f5e7bd; white-space:nowrap;
        background:linear-gradient(135deg, rgba(94,168,221,.30), rgba(201,162,77,.24));
      }
      .ring-box{ margin-left:auto; flex:0 0 auto; width:66px; height:66px; position:relative; }
      .ring-box svg{ display:block; transform:rotate(-90deg); }
      .ring-txt{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
      .ring-txt b{ font-size:16px; color:#fff; }
      .ring-txt span{ font-size:10px; color:var(--mut); }
      .big-title{
        font-family:"Noto Serif TC", serif; font-weight:900;
        font-size:clamp(34px, 9vw, 44px); letter-spacing:.04em;
        color:var(--gold2); margin:0 0 2px;
        text-shadow:0 0 18px rgba(236,205,111,.45), 0 0 42px rgba(94,168,221,.25);
      }
      .mono-line{
        display:flex; align-items:center; gap:9px;
        font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing:.3em; font-size:11.5px; color:var(--mut);
      }
      .mono-line .cdot{ flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:#35c4d8; box-shadow:0 0 8px rgba(53,196,216,.8); }
      .page-desc{ color:var(--mut); font-size:14.5px; margin:9px 0 12px; }
      .page-h1{ font-size:27px; font-weight:900; color:#fff; margin:4px 0 4px; }
      .page-desc2{ color:var(--mut); font-size:14.5px; margin:0 0 14px; }
      .day-nav{ display:flex; gap:8px; align-items:center; margin-bottom:14px; }
      .sq-btn{
        width:42px; height:42px; min-height:42px; border-radius:11px; padding:0;
        background:rgba(255,255,255,.05); border:1px solid rgba(120,150,190,.35);
        color:var(--ink); font-size:21px; font-weight:900; line-height:1;
      }
      .sq-btn:active{ background:rgba(255,255,255,.13); }
      .today-mini{
        min-height:38px; border-radius:10px; padding:5px 12px;
        background:rgba(255,255,255,.05); border:1px solid rgba(120,150,190,.32);
        color:var(--ink); font-weight:700; font-size:13px;
      }
      .target-toggle{ margin-left:auto; min-height:36px !important; padding:4px 12px; font-size:12.5px; }
      .target-panel{
        margin:-4px 0 12px; padding:10px 12px; border-radius:12px;
        border:1px solid rgba(120,150,190,.25); background:rgba(255,255,255,.03);
      }
      .target-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--mut); font-size:13px; }
      .target-row input{ width:58px; background:rgba(255,255,255,.06); border:1px solid rgba(120,150,190,.35); border-radius:8px; padding:5px 8px; color:var(--ink); min-height:36px; }

      /* ---------- quota cards ---------- */
      .qcard{ margin-bottom:12px; overflow:hidden; }
      .qcard.zoom{ position:fixed; inset:8px; z-index:70; overflow-y:auto; background:linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(135deg, rgba(94,168,221,.60), rgba(94,168,221,.10) 42%, rgba(201,162,77,.10) 58%, rgba(201,162,77,.60)) border-box; }
      .qhead{
        position:relative; width:100%; display:block; text-align:left;
        background:transparent; border:0; color:var(--ink); padding:16px 16px 26px; min-height:64px;
      }
      .qtitle{ display:block; font-size:19px; font-weight:900; color:#fff; line-height:1.3; padding-right:110px; }
      .qtitle .vid-state{ color:var(--mut); font-size:15px; font-weight:700; margin-left:8px; }
      .qtitle .vid-state.on{ color:var(--green); }
      .qsub{ display:block; color:var(--mut); font-size:13.5px; margin-top:5px; line-height:1.65; padding-right:40px; }
      .qsub b{ color:var(--gold2); }
      .qbig{ position:absolute; top:14px; right:16px; font-size:30px; font-weight:900; line-height:1.1; white-space:nowrap; }
      .qbig .num{ color:var(--gold2); text-shadow:0 0 10px rgba(236,205,111,.30); }
      .qbig .of{ color:#fff; font-size:17px; font-weight:700; }
      .qbig.done .num{ color:var(--green); text-shadow:0 0 10px rgba(76,195,138,.30); }
      .qchev{ position:absolute; right:18px; bottom:9px; color:var(--mut); font-size:14px; transition:transform .2s; }
      .qcard.open .qchev{ transform:rotate(180deg); }
      .qbody{ display:none; padding:2px 14px 16px; }
      .qcard.open .qbody{ display:block; }
      .qbody-head{ display:flex; justify-content:flex-end; margin-bottom:8px; }
      .zoom-btn{
        border:1px solid rgba(120,150,190,.35); background:rgba(255,255,255,.04);
        border-radius:999px; color:#dbe6f2; padding:5px 14px; font-size:13.5px; font-weight:700; min-height:36px;
      }

      .gold-btn{
        border:1px solid rgba(201,162,77,.55); border-radius:12px; min-height:44px;
        padding:9px 18px; font-weight:900; color:#171106; font-size:15.5px;
        background:linear-gradient(135deg, var(--gold2), var(--gold));
        box-shadow:0 0 14px rgba(201,162,77,.22);
      }
      .gold-btn:active{ filter:brightness(1.08); }
      .teal-btn{
        border:0; border-radius:12px; min-height:48px;
        padding:10px 22px; font-weight:900; color:#052530; font-size:16.5px;
        background:linear-gradient(135deg, #4fd6ea, #23b1d4);
        box-shadow:0 0 16px rgba(62,198,221,.35);
      }
      .teal-btn:active{ filter:brightness(1.07); }
      .ghost-btn{
        background:rgba(255,255,255,.05); border:1px solid rgba(120,150,190,.32);
        border-radius:11px; color:var(--ink); padding:7px 14px; font-weight:700; min-height:42px; font-size:14.5px;
      }
      .ghost-btn:active{ background:rgba(255,255,255,.12); }
      .mini-btn{
        background:rgba(255,255,255,.05); border:1px solid rgba(120,150,190,.28);
        border-radius:9px; color:#dbe6f2; padding:5px 11px; font-size:13.5px; font-weight:700; min-height:38px;
      }
      .mini-btn.danger{ color:#f0b7c8; border-color:rgba(229,138,165,.35); }
      .mini-btn:active{ background:rgba(255,255,255,.12); }

      /* ---------- inline forms (screenshot style: underline fields) ---------- */
      .inline-form{
        border:1px solid rgba(120,150,190,.28); border-radius:14px;
        padding:14px 14px 16px; margin-top:12px; background:rgba(255,255,255,.02);
      }
      .fld{ margin-bottom:13px; }
      .fld label, .fld-label{ font-size:13.5px; font-weight:700; color:var(--mut); display:block; margin-bottom:2px; }
      .fld input, .fld select, .fld textarea,
      .inline-form > input, .picker input[type="text"]{
        width:100%; background:transparent; border:0; border-radius:0;
        border-bottom:1px solid rgba(120,150,190,.45);
        padding:8px 2px; color:var(--ink); min-height:42px;
      }
      .fld textarea{ resize:vertical; }
      .fld input::placeholder, .fld textarea::placeholder, .picker input::placeholder{ color:var(--mut2); }
      .form-btns{ display:flex; gap:10px; margin-top:6px; }
      .form-btns .teal-btn{ flex:1; }
      .warn-box{
        border:1px solid rgba(217,154,61,.55); background:rgba(217,154,61,.10);
        border-radius:11px; padding:10px 12px; font-size:14px; color:#f6ddae; margin:10px 0;
      }
      .warn-box .row{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
      .warn-banner{
        border:1px solid rgba(242,201,60,.55); background:rgba(62,46,8,.35);
        border-radius:12px; padding:11px 13px; font-weight:700; font-size:14px; color:#f5cf5a; margin:14px 0 2px;
      }

      /* ---------- group heads ---------- */
      .group-head{
        width:100%; display:flex; align-items:center; gap:10px; text-align:left;
        background:transparent; border:0; color:#fff; padding:14px 2px 10px; min-height:48px;
      }
      .group-head h3{ font-size:17.5px; font-weight:900; margin:0; }
      .group-head .gsub{ color:var(--mut); font-size:13px; }
      .group-head .gchev{ margin-left:auto; color:var(--mut); transition:transform .2s; }
      .group-head.closed .gchev{ transform:rotate(180deg); }

      /* ---------- person cards ---------- */
      .plist{ display:flex; flex-direction:column; gap:10px; }
      .pcard{
        border:1px solid rgba(120,150,190,.20); border-radius:14px;
        padding:12px 12px 11px; background:rgba(255,255,255,.02);
      }
      .pcard.editing{
        background:linear-gradient(160deg, rgba(35,105,138,.48), rgba(13,38,62,.60));
        border-color:rgba(62,198,221,.55);
        box-shadow:0 0 18px rgba(62,198,221,.18);
      }
      .p-row1{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .p-name{ font-size:18px; font-weight:900; color:#fff; word-break:break-all; }
      .p-star{ font-size:17px; line-height:1; }
      .p-star.vip{ color:var(--teal); text-shadow:0 0 9px rgba(109,171,185,.5); }
      .p-star.abo{ color:var(--gold); text-shadow:0 0 9px rgba(201,162,77,.5); }
      .src-chip{
        border:1px solid rgba(120,150,190,.4); border-radius:999px;
        padding:1px 10px; font-size:12px; color:#c6d6ea; line-height:1.8; white-space:nowrap;
      }
      .follow-chip{
        border:1px solid rgba(201,162,77,.6); border-radius:999px;
        padding:1px 9px; font-size:11.5px; font-weight:900; color:var(--gold2); line-height:1.8; white-space:nowrap;
      }
      .p-row2{ margin-top:8px; }
      .rename-chip{
        border:1px solid rgba(120,150,190,.35); background:rgba(255,255,255,.04);
        border-radius:999px; color:#dbe6f2; padding:4px 14px; font-size:13.5px; font-weight:700; min-height:36px;
      }
      .p-row3{ display:flex; align-items:center; gap:9px; margin-top:11px; }
      .swap-sq{
        flex:0 0 auto; width:44px; height:44px; min-height:44px; border-radius:11px; padding:0;
        background:rgba(255,255,255,.05); border:1px solid rgba(120,150,190,.32);
        color:#dbe6f2; font-size:18px; line-height:1;
      }
      .status-pill{
        flex:0 0 auto; border-radius:999px; padding:7px 16px; font-weight:900; font-size:14.5px;
        border:1px solid; min-height:44px; min-width:92px;
      }
      .st-0{ color:#c3cfdf; background:rgba(148,170,200,.12); border-color:rgba(148,170,200,.35); }
      .st-1{ color:#f2c184; background:rgba(217,154,61,.13); border-color:rgba(217,154,61,.45); }
      .st-2{ color:#8fe3b6; background:rgba(76,195,138,.13); border-color:rgba(76,195,138,.45); }
      .m-0{ color:#c3cfdf; background:rgba(148,170,200,.12); border-color:rgba(148,170,200,.35); }
      .m-1{ color:#a9d4f5; background:rgba(94,168,221,.14); border-color:rgba(94,168,221,.45); }
      .m-2{ color:#8fe3b6; background:rgba(76,195,138,.13); border-color:rgba(76,195,138,.45); }
      .m-3{ color:#cbb8d9; background:rgba(160,139,181,.13); border-color:rgba(160,139,181,.45); }
      .o-0{ color:#c3cfdf; background:rgba(148,170,200,.12); border-color:rgba(148,170,200,.35); }
      .o-1{ color:#a9d4f5; background:rgba(94,168,221,.14); border-color:rgba(94,168,221,.45); }
      .o-2{ color:#8fe3b6; background:rgba(76,195,138,.13); border-color:rgba(76,195,138,.45); }
      .o-3{ color:#cbb8d9; background:rgba(160,139,181,.13); border-color:rgba(160,139,181,.45); }
      .p-row4{ margin-top:10px; color:var(--mut); font-size:14px; }
      .p-row4 .edit-link{
        background:none; border:0; color:var(--cyan); font-weight:900; font-size:14px;
        padding:2px 4px; min-height:32px;
      }
      .edit-top{ display:flex; gap:9px; margin-bottom:12px; }
      .edit-top .teal-btn{ flex:1; font-size:15.5px; padding:10px 8px; }
      .edit-fields .fld{ margin-bottom:9px; }
      .edit-fields input{
        width:100%; background:rgba(6,14,24,.45); border:1px solid rgba(62,198,221,.35);
        border-radius:10px; padding:8px 11px; color:var(--ink); min-height:42px;
      }
      .edit-fields label{ font-size:12.5px; color:#a9c8d8; display:block; margin-bottom:3px; }
      .star-cycle{
        border:1px solid rgba(120,150,190,.35); background:rgba(6,14,24,.45);
        border-radius:10px; min-width:52px; min-height:42px; font-size:21px; color:#54657c;
      }
      .star-cycle.vip{ color:var(--teal); } .star-cycle.abo{ color:var(--gold); }
      .arch-tag{ color:#f0b7c8; font-size:12.5px; font-weight:700; }
      .pcard.archived{ opacity:.6; }

      /* ---------- relationship slider ---------- */
      .rel{ display:flex; align-items:center; gap:10px; flex:1; min-width:150px; }
      .rel-track{
        position:relative; flex:1; height:10px; border-radius:6px;
        background:#1d2739; cursor:pointer; touch-action:none; outline:none;
      }
      .rel-track:focus-visible{ box-shadow:0 0 0 2px rgba(62,198,221,.6); }
      .rel-grad{
        position:absolute; inset:0; border-radius:6px;
        background:linear-gradient(90deg, #2e9be6 0%, #43bcc4 30%, #a9be57 68%, #e9c44e 100%);
      }
      .rel-dot{
        position:absolute; top:50%; width:5px; height:5px; border-radius:50%;
        background:rgba(6,10,19,.55); transform:translate(-50%,-50%); z-index:2;
      }
      .rel-orb{
        position:absolute; top:50%; width:21px; height:21px; border-radius:50%;
        transform:translate(-50%,-50%); z-index:3;
        border:2px solid rgba(255,255,255,.22);
      }
      .rel-lvl{ color:#dbe6f2; font-size:13.5px; font-weight:700; white-space:nowrap; min-width:42px; }
      .rel.mini .rel-track{ height:8px; }
      .rel.mini .rel-orb{ width:16px; height:16px; }
      .rel.mini .rel-lvl{ font-size:12.5px; min-width:38px; }

      /* ---------- modal (swap / poster) ---------- */
      .modal-wrap{
        position:fixed; inset:0; z-index:80; display:none; overflow-y:auto;
        padding:14px 12px 30px;
        background:rgba(4,7,13,.62);
        backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      }
      .modal-wrap.show{ display:block; }
      .modal-card{ width:100%; max-width:560px; margin:3vh auto; padding:18px 16px 16px; }
      .modal-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
      .modal-head h3{ margin:0; font-size:20px; font-weight:900; color:#fff; flex:1; }
      .x-btn{
        flex:0 0 auto; width:42px; height:42px; min-height:42px; border-radius:50%; padding:0;
        background:rgba(255,255,255,.05); border:1px solid rgba(120,150,190,.35); color:#fff; font-size:16px;
      }
      .confirm-box{
        border:1px solid rgba(120,150,190,.28); border-radius:14px;
        padding:13px 14px; background:rgba(255,255,255,.02); margin-bottom:14px;
      }
      .confirm-box p{ margin:0 0 10px; color:var(--mut); font-size:14.5px; }
      .confirm-box p b{ color:#fff; }
      .confirm-row{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
      .confirm-chip{
        border-radius:999px; padding:6px 15px; font-size:14px; min-height:40px; font-weight:700;
        border:1px solid rgba(120,150,190,.32); background:rgba(255,255,255,.04); color:#c6d6ea;
      }
      .confirm-chip.on{ color:#171106; font-weight:900; background:linear-gradient(135deg, var(--gold2), var(--gold)); border-color:rgba(201,162,77,.65); }
      .confirm-chip.on-old{ color:#f6d9e2; font-weight:900; background:rgba(229,138,165,.20); border-color:rgba(229,138,165,.6); }
      .record-line{ margin:10px 0 0 !important; color:#d8e4f2 !important; font-size:14px; }
      .random-box{
        border:1px solid rgba(242,201,60,.55); border-radius:14px;
        background:rgba(62,46,8,.28); padding:14px; margin-bottom:16px;
      }
      .random-box .rb-head{ display:flex; align-items:center; gap:10px; }
      .random-box .rb-head span{ flex:1; font-size:17px; font-weight:900; color:#f5cf5a; }
      .random-box p{ margin:9px 0 0; color:var(--mut); font-size:13.5px; }
      .newname-row{ display:flex; gap:9px; align-items:flex-end; margin-top:6px; }
      .newname-row input{
        flex:1; background:transparent; border:0; border-radius:0;
        border-bottom:1px solid rgba(120,150,190,.45); padding:8px 2px; color:var(--ink); min-height:42px;
      }
      .newname-row input::placeholder{ color:var(--mut2); }
      .use-name-btn{
        flex:0 0 auto; border:1px solid rgba(62,198,221,.45); background:rgba(62,198,221,.10);
        color:#a9e6f2; border-radius:11px; padding:7px 14px; font-weight:900; min-height:42px;
      }
      .common-title{ color:var(--gold2); font-size:16.5px; font-weight:900; margin:18px 0 2px; }

      /* ---------- people picker ---------- */
      .pick-list{ max-height:340px; overflow-y:auto; }
      .pick-row{ border-bottom:1px solid rgba(255,255,255,.07); padding:10px 0; }
      .pick-line1{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .pick-name{ font-size:16.5px; font-weight:900; color:#fff; }
      .add-btn{
        margin-left:auto; flex:0 0 auto; border:0; border-radius:999px;
        padding:9px 19px; font-weight:900; font-size:15px; min-height:42px;
        background:linear-gradient(135deg, #4fd6ea, #23b1d4); color:#052530;
        box-shadow:0 0 12px rgba(62,198,221,.30);
      }
      .add-btn[disabled]{ background:rgba(255,255,255,.08); color:var(--mut); box-shadow:none; cursor:default; }
      .pick-line2{ display:flex; align-items:center; gap:9px; margin-top:9px; }
      .flag-chip{

        background:none; border:0; font-size:22px; min-height:38px; min-width:38px; color:#54657c; padding:0;

      .meet-chip .mc{ color:var(--mut); font-size:12.5px; display:block; margin-top:2px; white-space:nowrap; }

      .poster .zoom-chip{

      }
      .share-btn svg{ flex:0 0 auto; }

      /* ---------- appointments / misc ---------- */
      .appt-row{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }

      .appt-row .who{ font-weight:900; color:#fff; }
      .appt-row .pp{ color:var(--mut); font-size:13.5px; }
      .seg{ display:flex; border:1px solid rgba(120,150,190,.35); border-radius:12px; overflow:hidden; }
      .seg button{ flex:1; background:rgba(255,255,255,.04); border:0; color:var(--mut); font-weight:900; min-height:48px; font-size:16px; }
      .seg button.on{ background:linear-gradient(135deg, var(--gold2), var(--gold)); color:#171106; }
      .pool-row{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
      .pool-row:last-child{ border-bottom:0; }
      .pool-row .pn{ font-weight:700; color:#fff; }
      .pool-row .pm{ color:var(--mut2); font-size:12px; }
      .log-row{ font-size:13.5px; color:var(--mut); padding:6px 0; border-bottom:1px solid rgba(255,255,255,.05); }
      .log-row:last-child{ border-bottom:0; }
      .log-row .who{ color:#fff; font-weight:700; }
      .week-row{ display:flex; align-items:center; gap:7px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px; flex-wrap:wrap; }
      .week-row:last-child{ border-bottom:0; }
      .week-row .wd{ font-weight:900; color:#fff; min-width:92px; }
      .week-chip{ border-radius:16px; padding:3px 10px; font-size:12.5px; border:1px solid rgba(255,255,255,.14); color:var(--mut); }
      .week-chip b{ color:#fff; }
      .week-chip.hit{ border-color:rgba(76,195,138,.5); color:#8fe3b6; }
      .week-chip.hit b{ color:#8fe3b6; }
      .close-fields label{ font-size:12.5px; color:var(--mut); display:block; margin:10px 0 3px; }

      .toast{

      @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

              <div class="fld"><label for="fn-purpose">目的</label><input id="fn-purpose" type="text" placeholder="想傾啲咩" /></div>

    <script>
    'use strict';
    /* ================= helpers ================= */

    /* ================= autofill (living-list logic) ================= */
    function eligibleFollow(p, ds, used){ return p.origin !== 'new' && !used[p.id] && !p.archived; }
    function byOldestRoster(a, b){
      var da = a.lastRoster ? daysBetween(a.lastRoster, todayStr()) : 9999;
      var db = b.lastRoster ? daysBetween(b.lastRoster, todayStr()) : 9999;
      return db - da;
    }
    function byOldestContact(a, b){
      var da = a.lastContact ? daysBetween(a.lastContact, todayStr()) : 9999;
      var db = b.lastContact ? daysBetween(b.lastContact, todayStr()) : 9999;
      return db - da;
    }
    function autofill(ds){
      if(hasRoster(ds)) return false;
      var day = dayOf(ds);
      var used = {};
      function takeFollow(p, st){
        if(!p || used[p.id] || p.archived) return false;
        used[p.id] = 1;
        day.follow.push({ pid:p.id, st: st || 0 });
        p.lastRoster = ds;
        return true;
      }
      function takeNew(p, st){
        if(!p || used[p.id] || p.archived) return false;
        used[p.id] = 1;
        day.newc.push({ pid:p.id, st: st || 0 });
        p.lastRoster = ds;
        return true;
      }
      var y = state.days[addDays(ds, -1)];
      var yOnRoster = {};
      if(y){ y.follow.concat(y.newc).forEach(function(r){ yOnRoster[r.pid] = 1; }); }
      if(y){
        var co = 0;
        y.follow.forEach(function(r){
          if(co >= 4 || day.follow.length >= FOLLOW_N) return;
          if(r.st !== 2){ var p = person(r.pid); if(p && p.origin !== 'new' && takeFollow(p, r.st)) co++; }
        });
      }
      state.pool.filter(function(p){ return p.follow && eligibleFollow(p, ds, used); })
        .filter(function(p){ return p.next || !p.lastRoster || daysBetween(p.lastRoster, ds) >= 3; })
        .sort(byOldestRoster)
        .forEach(function(p){ if(day.follow.length < FOLLOW_N) takeFollow(p); });
      state.pool.filter(function(p){ return p.cat === 3 && eligibleFollow(p, ds, used); })
        .sort(function(a, b){
          var sa = a.type !== 'none' ? 1 : 0, sb = b.type !== 'none' ? 1 : 0;
          if(sa !== sb) return sb - sa;
          return byOldestRoster(a, b);
        })
        .forEach(function(p){ if(day.follow.length < FOLLOW_N) takeFollow(p); });
      state.pool.filter(function(p){ return p.cat === 2 && eligibleFollow(p, ds, used) && !yOnRoster[p.id]; })
        .sort(byOldestRoster)
        .forEach(function(p){ if(day.follow.length < FOLLOW_N) takeFollow(p); });
      state.pool.filter(function(p){ return p.cat === 4 && eligibleFollow(p, ds, used); })
        .filter(function(p){ return !p.lastRoster || daysBetween(p.lastRoster, ds) >= 7; })
        .sort(byOldestContact)
        .forEach(function(p){ if(day.follow.length < FOLLOW_N) takeFollow(p); });
      state.pool.filter(function(p){ return eligibleFollow(p, ds, used); })
        .sort(byOldestRoster)
        .forEach(function(p){ if(day.follow.length < FOLLOW_N) takeFollow(p); });
      if(y){
        y.newc.forEach(function(r){
          if(day.newc.length >= NEW_N) return;
          if(r.st !== 2){ var p = person(r.pid); if(p && p.origin === 'new') takeNew(p, r.st); }
        });
      }
      state.pool.filter(function(p){ return p.origin === 'new' && !used[p.id] && !p.archived; })
        .filter(function(p){ return !p.lastRoster || daysBetween(p.lastRoster, ds) >= 7; })
        .sort(byOldestRoster)
        .forEach(function(p){ if(day.newc.length < NEW_N) takeNew(p); });
      state.pool.filter(function(p){ return p.origin === 'new' && !used[p.id] && !p.archived; })
        .sort(byOldestRoster)
        .forEach(function(p){ if(day.newc.length < NEW_N) takeNew(p); });
      return true;
    }
    function pickRefill(ds, group, removedCat){
      var day = dayOf(ds);
      var inRoster = {};
      day.follow.concat(day.newc).forEach(function(r){ inRoster[r.pid] = 1; });
      (day.removed || []).forEach(function(pid){ inRoster[pid] = 1; });
      var cands = state.pool.filter(function(p){
        if(inRoster[p.id] || p.archived) return false;
        return group === 'newc' ? p.origin === 'new' : p.origin !== 'new';
      });
      if(!cands.length) return null;
      cands.sort(function(a, b){
        var ca = (removedCat && a.cat === removedCat) ? 0 : 1;
        var cb = (removedCat && b.cat === removedCat) ? 0 : 1;
        if(ca !== cb) return ca - cb;
        var ka = (!a.lastRoster || daysBetween(a.lastRoster, ds) >= 7) ? 0 : 1;
        var kb = (!b.lastRoster || daysBetween(b.lastRoster, ds) >= 7) ? 0 : 1;
        if(ka !== kb) return ka - kb;
        return byOldestRoster(a, b);
      });
      return cands[0];
    }
    function refill(ds, group, removedCat){
      var day = dayOf(ds);
      var target = group === 'newc' ? NEW_N : FOLLOW_N;
      var added = null;
      while(day[group].length < target){
        var c = pickRefill(ds, group, removedCat);
        if(!c) break;
        day[group].push({ pid:c.id, st:0 });
        c.lastRoster = ds;
        added = c;
      }
      return added;
    }

          '<div class="rel-orb" style="left:' + pct + '%;background:radial-gradient(circle at 38% 32%, ' + c[1] + ', ' + c[0] + ' 62%);box-shadow:0 0 9px ' + c[0] + '59"></div>' +
        '</div><span class="rel-lvl">' + REL_NAMES[p.rel - 1] + '</span></div>';

    function relApplyUI(pid){
      var p = person(pid); if(!p) return;
      var pct = (p.rel - 1) / 4 * 100;
      var c = ORB[p.rel] || ORB[1];
      document.querySelectorAll('[data-relslider="' + pid + '"]').forEach(function(tr){
        var grad = tr.querySelector('.rel-grad');
        if(grad) grad.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
        var orb = tr.querySelector('.rel-orb');
        if(orb){
          orb.style.left = pct + '%';
          orb.style.background = 'radial-gradient(circle at 38% 32%, ' + c[1] + ', ' + c[0] + ' 62%)';
          orb.style.boxShadow = '0 0 9px ' + c[0] + '59';
        }
        tr.setAttribute('aria-valuenow', p.rel);
        var wrap = tr.parentElement;
        var lvl = wrap ? wrap.querySelector('.rel-lvl') : null;
        if(lvl) lvl.textContent = REL_NAMES[p.rel - 1];
      });
    }
    function relSetFromEvent(track, e){
      var rect = track.getBoundingClientRect();
      var f = (e.clientX - rect.left) / rect.width;
      f = Math.max(0, Math.min(1, f));
      return Math.round(f * 4) + 1;
    }
    document.addEventListener('pointerdown', function(e){
      var tr = e.target.closest ? e.target.closest('[data-relslider]') : null;
      if(!tr) return;
      e.preventDefault();
      var pid = tr.getAttribute('data-relslider');
      var p = person(pid); if(!p) return;
      var v0 = relSetFromEvent(tr, e);
      if(v0 !== p.rel){ p.rel = v0; relApplyUI(pid); }
      function move(ev){ var v = relSetFromEvent(tr, ev); if(v !== p.rel){ p.rel = v; relApplyUI(pid); } }
      function up(){ document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); save(); }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    document.addEventListener('keydown', function(e){
      var tr = e.target.closest ? e.target.closest('[data-relslider]') : null;
      if(!tr) return;
      var p = person(tr.getAttribute('data-relslider')); if(!p) return;
      if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ p.rel = Math.min(5, p.rel + 1); }
      else if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ p.rel = Math.max(1, p.rel - 1); }
      else return;
      e.preventDefault();
      relApplyUI(p.id); save();
    });

    function pickerDisabled(p, ctx, targetId){
      var ds = state.viewDate, day = dayOf(ds);

        var inR = false;
        day.follow.concat(day.newc).forEach(function(r){ if(r.pid === p.id) inR = true; });

      }
      var coll = ctx === 'meet' ? state.meetings : state.offers;
      var item = null;
      coll.forEach(function(x){ if(x.id === targetId) item = x; });

    function fillPicker(ctx, targetId, group){
      var listId = pickerListId(ctx, targetId);

      var list = state.pool.filter(function(p){ return !p.archived; }).slice().sort(function(a, b){
        var fa = a.follow ? 1 : 0, fb = b.follow ? 1 : 0;
        if(fa !== fb) return fb - fa;
        var sa = a.type !== 'none' ? 1 : 0, sb = b.type !== 'none' ? 1 : 0;
        if(sa !== sb) return sb - sa;
        return byOldestRoster(a, b);
      });
      var cntEl = document.querySelector('[data-pickcount="' + listId + '"]');
      if(cntEl) cntEl.textContent = list.length;
      if(ctx === 'swap') $('swapCount').textContent = list.length;
      el.innerHTML = list.map(function(p){
        var dis = pickerDisabled(p, ctx, targetId);

    /* ================= swap modal ================= */
    function openSwap(group, pid){
      var p = person(pid); if(!p) return;
      ui.swap = { group: group, pid: pid };
      ui.swapRecord = '';
      $('swapTitle').textContent = '替換「' + p.name + '」';
      $('swapConfirmName').textContent = p.name;
      $('swapRecord').classList.add('hidden');
      $('swapSearch').value = '';
      $('swapNewName').value = '';
      document.querySelectorAll('[data-swapconfirm]').forEach(function(b){
        b.classList.toggle('on', p.confirm === b.getAttribute('data-swapconfirm') && b.getAttribute('data-swapconfirm') !== 'old');
        b.classList.toggle('on-old', p.confirm === 'old' && b.getAttribute('data-swapconfirm') === 'old');
      });
      fillPicker('swap', '', group);
      $('swapWrap').classList.add('show');
    }
    function closeSwap(){ ui.swap = null; $('swapWrap').classList.remove('show'); }
    function doSwap(newPerson){
      if(!ui.swap || !newPerson) return;
      var ds = state.viewDate, day = dayOf(ds);
      var group = ui.swap.group, oldPid = ui.swap.pid;
      var old = person(oldPid);
      var idx = -1;
      day[group].forEach(function(r, i){ if(r.pid === oldPid) idx = i; });
      if(idx < 0){ closeSwap(); return; }
      day[group][idx] = { pid: newPerson.id, st: 0, note: '' };
      if(!day.removed) day.removed = [];
      if(day.removed.indexOf(oldPid) < 0) day.removed.push(oldPid);
      newPerson.lastRoster = ds;
      closeSwap();
      save(); renderAll();
      toast('已換人：' + (old ? old.name : '') + ' → ' + newPerson.name);
    }
    $('swapClose').addEventListener('click', closeSwap);
    $('swapWrap').addEventListener('click', function(e){ if(e.target === this) closeSwap(); });
    document.querySelectorAll('[data-swapconfirm]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!ui.swap) return;
        var p = person(ui.swap.pid); if(!p) return;
        var kind = this.getAttribute('data-swapconfirm');
        var rec = '';
        if(kind === 'same'){ p.confirm = 'same'; p.archived = false; rec = '已記錄：照舊。'; }
        else if(kind === 'less'){
          p.confirm = 'less'; p.archived = false;
          if(p.type !== 'none'){
            state.starLog.unshift({ pid:p.id, name:p.name, from:p.type, to:'none', at: new Date().toLocaleString('zh-Hant') });
            if(state.starLog.length > 60) state.starLog.length = 60;
            p.type = 'none';
          }
          rec = '已記錄：冇咁積極，星星已取消。';
        }
        else { p.confirm = 'old'; p.archived = true; rec = '已記錄：舊名單・唔使跟。'; }
        ui.swapRecord = rec;
        var rl = $('swapRecord');
        rl.textContent = rec;
        rl.classList.remove('hidden');
        document.querySelectorAll('[data-swapconfirm]').forEach(function(x){
          x.classList.toggle('on', kind === x.getAttribute('data-swapconfirm') && kind !== 'old');
          x.classList.toggle('on-old', kind === 'old' && x.getAttribute('data-swapconfirm') === 'old');
        });
        save(); renderAll(); fillPicker('swap', '', ui.swap.group);
      });
    });
    $('swapRandom').addEventListener('click', function(){
      if(!ui.swap) return;
      var ds = state.viewDate, day = dayOf(ds);
      var inRoster = {};
      day.follow.concat(day.newc).forEach(function(r){ inRoster[r.pid] = 1; });
      var wantNew = ui.swap.group === 'newc';
      var bag = [];
      state.pool.forEach(function(p){
        if(p.archived || inRoster[p.id]) return;
        if(wantNew ? p.origin !== 'new' : p.origin === 'new') return;
        var w = p.type !== 'none' ? 3 : 1;
        for(var i = 0; i < w; i++) bag.push(p);
      });
      if(!bag.length){ toast('池入面冇其他合資格人選可抽'); return; }
      doSwap(bag[Math.floor(Math.random() * bag.length)]);
    });
    $('swapUseNew').addEventListener('click', function(){
      if(!ui.swap) return;
      var name = $('swapNewName').value.trim();
      if(!name){ toast('入咗名先'); return; }
      var existing = findByName(state.pool, name);
      if(existing){ doSwap(existing); return; }
      var np = { id: uid('p'), name:name, alias:'', tag:'', cat: ui.swap.group === 'newc' ? 1 : 4,
                 origin: ui.swap.group === 'newc' ? 'new' : 'talent', type:'none', rel:1, follow:false, next:false,
                 lastRoster: state.viewDate, lastContact:null, note:'' };

      doSwap(np);
    });

    function renderWeekOverview(){

          '<div class="plist">' + m.people.map(function(x){ return memberRowHTML(x, 'meet', m.id); }).join('') + '</div>' +

    /* ================= daily actions ================= */
    function addFromForm(kind, force){
      var isNew = kind === 'new';
      var nameInp = $(isNew ? 'fn-name' : 'fc-name');
      var name = nameInp.value.trim();
      if(!name){ toast('入咗名先'); nameInp.focus(); return; }
      var stVal = parseInt($(isNew ? 'fn-status' : 'fc-status').value, 10);
      var purpose = $(isNew ? 'fn-purpose' : 'fc-purpose').value.trim();
      var resp = isNew ? '' : $('fc-resp').value.trim();
      var next = isNew ? '' : $('fc-next').value.trim();
      var warnId = isNew ? 'fn-warn' : 'fc-warn';
      var ds = state.viewDate, day = dayOf(ds);
      var group = isNew ? 'newc' : 'follow';
      var p = findByName(state.pool, name);
      if(!p){
        var sim = similarPeople(name);
        if(sim.length && force !== true){ $(warnId).innerHTML = warnHTML(sim, kind); return; }
        p = { id: uid('p'), name:name, alias:'', tag:'', cat: isNew ? 1 : 4, origin: isNew ? 'new' : 'talent',
              type:'none', rel:1, follow:false, next:false, lastRoster:ds, lastContact:null, note:'' };
        state.pool.push(p);
      }
      if(isNew && p.origin !== 'new'){ toast(name + ' 唔係新人來源，唔入新聯絡組'); return; }
      if(!isNew && p.origin === 'new'){ toast(name + ' 係新人來源，請去陌生認識嗰邊加'); return; }
      var row = null;
      day[group].forEach(function(r){ if(r.pid === p.id) row = r; });
      if(!row){ row = { pid:p.id, st:0 }; day[group].push(row); }
      row.st = stVal;
      if(purpose) row.note = purpose;
      if(resp) row.resp = resp;
      if(next) row.nextStep = next;
      if(stVal === 2) p.lastContact = ds;
      p.lastRoster = ds;
      $(warnId).innerHTML = '';
      nameInp.value = '';
      if(!isNew){ $('fc-purpose').value = ''; $('fc-resp').value = ''; $('fc-next').value = ''; }
      else { $('fn-purpose').value = ''; }
      save(); renderAll();
      toast('已加 ' + name + '，狀態：' + D_STATUS[stVal]);
    }
    function addAppt(){
      var name = $('fa-name').value.trim();
      if(!name){ toast('入咗名先'); $('fa-name').focus(); return; }
      var time = $('fa-time').value;
      var purpose = $('fa-purpose').value.trim();
      var stVal = parseInt($('fa-status').value, 10);
      dayOf(state.viewDate).appts.push({ name:name, time:time || '', purpose:purpose, st:stVal });
      var p = findByName(state.pool, name);
      if(p) p.lastContact = state.viewDate;
      $('fa-name').value = ''; $('fa-purpose').value = '';
      save(); renderAll(); toast('已記錄約會：' + name + (time ? ' ' + time : ''));
    }

    /* ================= global click delegation ================= */
    document.addEventListener('click', function(e){
      var dupUse = e.target.closest('[data-dup-use]');
      if(dupUse){
        var kind = dupUse.getAttribute('data-dup-kind');
        var nm = dupUse.getAttribute('data-dup-use');
        if(kind === 'contact'){ $('fc-name').value = nm; $('fc-warn').innerHTML = ''; addFromForm('contact', true); }
        else { $('fn-name').value = nm; $('fn-warn').innerHTML = ''; addFromForm('new', true); }
        return;
      }
      var dupForce = e.target.closest('[data-dup-force]');
      if(dupForce){
        if(dupForce.getAttribute('data-dup-force') === 'contact'){ $('fc-warn').innerHTML = ''; addFromForm('contact', true); }
        else { $('fn-warn').innerHTML = ''; addFromForm('new', true); }
        return;
      }
      var posterBtn = e.target.closest('[data-poster]');
      if(posterBtn){
        $('posterTitle').textContent = posterBtn.getAttribute('data-poster');
        $('posterWrap').classList.add('show');
        return;
      }
      var useName = e.target.closest('[data-usename]');
      if(useName){
        var uctx = useName.getAttribute('data-usename');
        var utarget = useName.getAttribute('data-target');
        var uinp = $('newname-' + uctx + '-' + utarget);
        var uname = uinp ? uinp.value.trim() : '';
        if(!uname){ toast('入咗名先'); return; }
        var up = findByName(state.pool, uname);
        if(!up){
          up = { id: uid('p'), name:uname, alias:'', tag:'', cat:4, origin:'talent', type:'none', rel:1,
                 follow:false, next:false, lastRoster:null, lastContact:null, note:'' };
          state.pool.push(up);
        }
        var ucoll = uctx === 'meet' ? state.meetings : state.offers;
        var uitem = null;
        ucoll.forEach(function(x){ if(x.id === utarget) uitem = x; });
        if(uitem){
          if(uitem.people.some(function(x){ return x.name === uname; })){ toast(uname + ' 已經喺名單入面'); return; }
          uitem.people.push({ pid: up.id, name: uname, st: 0 });
          save(); renderAll(); toast('已加 ' + uname);
        }
        return;
      }
      var pickAdd = e.target.closest('[data-pickadd]');
      if(pickAdd && !pickAdd.disabled){
        var pctx = pickAdd.getAttribute('data-pickadd');
        var pp = person(pickAdd.getAttribute('data-pid'));
        if(!pp) return;
        if(pctx === 'swap'){ doSwap(pp); return; }
        var ptarget = pickAdd.getAttribute('data-target');
        var pcoll = pctx === 'meet' ? state.meetings : state.offers;
        var pitem = null;
        pcoll.forEach(function(x){ if(x.id === ptarget) pitem = x; });
        if(pitem){
          if(pitem.people.some(function(x){ return x.name === pp.name; })){ toast(pp.name + ' 已經喺名單入面'); return; }
          pitem.people.push({ pid: pp.id, name: pp.name, st: 0 });
          save(); renderAll(); toast('已加 ' + pp.name);
        }
        return;
      }
      var gt = e.target.closest('[data-grouptoggle]');
      if(gt){
        var g = gt.getAttribute('data-grouptoggle');
        ui.groupOpen[g] = !ui.groupOpen[g];
        renderRoster();
        return;
      }
      var colBtn = e.target.closest('[data-collapse]');
      if(colBtn){ $(colBtn.getAttribute('data-collapse')).classList.toggle('open'); return; }

      var t = e.target.closest('[data-act]');
      if(!t) return;
      var act = t.getAttribute('data-act');
      var pid = t.getAttribute('data-pid');
      var p = pid ? person(pid) : null;
      var ds = state.viewDate, day = dayOf(ds);

      if(act === 'star' && p){ cycleStar(p); renderAll(); refreshPickers(); toast(p.name + ' 變做' + STAR_LABEL[p.type] + (p.type === 'abo' ? '，已記入晚間批次' : '')); }
      else if(act === 'status' && p){
        var group = t.getAttribute('data-group');
        var row = null;
        day[group].forEach(function(r){ if(r.pid === pid) row = r; });
        if(row){
          row.st = (row.st + 1) % 3;
          if(row.st === 2) p.lastContact = ds;
          save(); renderAll();
        }
      }
      else if(act === 'swap' && p){ openSwap(t.getAttribute('data-group'), pid); }
      else if(act === 'edit'){ ui.editingPid = pid; renderRoster(); var inp = $('ed-name'); if(inp){ inp.focus(); inp.select(); } }
      else if(act === 'cancel-edit'){ ui.editingPid = null; renderRoster(); }
      else if(act === 'save-edit' && p){
        var nn = $('ed-name').value.trim();
        var na = $('ed-alias').value.trim();
        var nt = $('ed-tag').value.trim();
        var nnote = $('ed-note').value.trim();
        if(!nn){ toast('人名唔可以空'); return; }
        var sim = similarPeople(nn, p.id);
        if(sim.length && nn !== p.name){
          $('ed-warn').innerHTML = '<div class="warn-box">池入面已有差唔多嘅名：<b>' + sim.map(function(x){ return esc(x.name); }).join('、') + '</b>，照樣儲存就會有兩個相似名。</div>';
          if(!t.dataset.confirmed){ t.dataset.confirmed = '1'; return; }
        }
        var old = p.name;
        p.name = nn; p.alias = na; p.tag = nt;
        ['follow','newc'].forEach(function(g){
          day[g].forEach(function(r){ if(r.pid === p.id) r.note = nnote; });
        });
        state.meetings.forEach(function(m){ m.people.forEach(function(x){ if(x.pid === p.id) x.name = nn; }); });
        state.offers.forEach(function(o){ o.people.forEach(function(x){ if(x.pid === p.id) x.name = nn; }); });
        day.appts.forEach(function(a){ if(a.name === old) a.name = nn; });
        ui.editingPid = null;
        save(); renderAll(); toast('已儲存：' + nn);
      }
      else if(act === 'remove' && p){
        var g2 = t.getAttribute('data-group');
        var idx = -1, removedCat = p.cat;
        day[g2].forEach(function(r, i){ if(r.pid === pid) idx = i; });
        if(idx >= 0){
          day[g2].splice(idx, 1);
          if(!day.removed) day.removed = [];
          day.removed.push(pid);
          if(ui.editingPid === pid) ui.editingPid = null;
          var added = refill(ds, g2, removedCat);
          save(); renderAll();
          toast(added ? '已移除 ' + p.name + '，即刻補返 ' + added.name : '已移除 ' + p.name + '（池入面暫時冇人可補）');
        }
      }
      else if(act === 'unarchive' && p){
        p.archived = false; p.confirm = 'same';
        save(); renderAll(); toast(p.name + ' 已恢復，會再入名單同抽人');
      }
      else if(act === 'del-appt'){
        day.appts.splice(parseInt(t.getAttribute('data-i'), 10), 1);
        save(); renderAll(); toast('已刪除約會記錄');
      }
      else if(act === 'flag-follow' && p){ p.follow = !p.follow; save(); renderAll(); refreshPickers(); toast(p.name + (p.follow ? ' 已標跟緊' : ' 已取消跟緊')); }
      else if(act === 'flag-next' && p){ p.next = !p.next; save(); renderPool(); toast(p.name + (p.next ? ' 已標有下一步' : ' 已取消下一步標記')); }
      else if(act === 'meet-status' || act === 'offer-status'){
        var parent = t.getAttribute('data-parent');
        var nm2 = t.getAttribute('data-name');
        var coll = act === 'meet-status' ? state.meetings : state.offers;
        coll.forEach(function(c){
          if(c.id === parent) c.people.forEach(function(x){ if(x.name === nm2) x.st = (x.st + 1) % 4; });
        });
        save(); renderAll();
      }
      else if(act === 'meet-remove' || act === 'offer-remove'){
        var parent2 = t.getAttribute('data-parent');
        var nm3 = t.getAttribute('data-name');
        var coll2 = act === 'meet-remove' ? state.meetings : state.offers;
        coll2.forEach(function(c){
          if(c.id === parent2) c.people = c.people.filter(function(x){ return x.name !== nm3; });
        });
        save(); renderAll(); toast('已移除 ' + nm3);
      }
    });

    $('noSave').addEventListener('click', function(){
      var name = $('no-name').value.trim();
      if(!name){ toast('入咗優惠名先'); return; }
      var badge = $('no-badge').value.trim();
      if(badge && badge.indexOf('禮品數量有限') < 0) badge += '・禮品數量有限，送完即止';
      var o = { id: uid('o'), name:name, badge:badge, desc: $('no-desc').value.trim(), people: [] };
      state.offers.push(o);
      $('no-name').value = ''; $('no-badge').value = ''; $('no-desc').value = '';
      $('offerForm').classList.add('hidden'); $('btnToggleOfferForm').textContent = '＋ 新增優惠';
      save(); renderOffers(); toast('已新增優惠「' + name + '」');
    });

    function renderAll(){ renderDaily(); renderMeetings(); renderOffers(); }
    renderTargets();
    renderAll();
    </script>
  </body>
</html>
